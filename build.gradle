plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // fat jar with dependencies
}

group = 'com.bot'
version = '2.1'

// Toolchain pins Java 21 on every environment.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // org.json is the only runtime dependency. The telegrambots library and slf4j-simple went with
    // the modules that used them: alerts are java.util.logging plus, optionally, one HTTPS call to
    // Telegram's REST API (AlertSink.Telegram), which needs no client library.
    implementation 'org.json:json:20240303'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
    // The property-based tests draw thousands of cases from a seeded PRNG. Override to reproduce a
    // reported failure exactly: ./gradlew test -Dbot.test.seed=123456
    systemProperty 'bot.test.seed', System.getProperty('bot.test.seed', '20260809')
}

application {
    mainClass = 'com.bot.app.TestnetBot'
}

run {
    // Credentials come from local.env, which is git-ignored and never committed. Loading them here
    // rather than asking the operator to type `export` has two points: the keys never touch a shell
    // history, and the command is identical on Git Bash, PowerShell and the IDE's green arrow —
    // which is one fewer way to end up wondering why the bot says the key is missing.
    //
    // A real environment variable still wins, so a deployment can set them the usual way.
    def secrets = file('local.env')
    if (secrets.exists()) {
        secrets.eachLine { rawLine ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#')) return
            def split = line.indexOf('=')
            if (split <= 0) return
            def key = line.substring(0, split).trim()
            def value = line.substring(split + 1).trim().replaceAll(/^["']|["']$/, '')
            if (System.getenv(key) == null && !value.isEmpty()) {
                environment key, value
            }
        }
    }
    // Without this the manual console source reads an empty stream: Gradle does not connect stdin
    // to the application by default, so typing a signal would go nowhere.
    standardInput = System.in
}

shadowJar {
    archiveFileName = 'bot.jar'
    mergeServiceFiles()
}

jar {
    manifest {
        attributes(
                "Main-Class": "com.bot.app.TestnetBot"
        )
    }
}
