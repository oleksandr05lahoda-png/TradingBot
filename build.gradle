plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // fat jar with dependencies
}

group = 'com.bot'
version = '2.0-testnet'

// Toolchain pins Java 21 on every environment.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // org.json is the only runtime dependency. The telegrambots library and slf4j-simple went with
    // the modules that used them: alerts are java.util.logging plus, optionally, one HTTPS call to
    // Telegram's REST API (AlertSink.Telegram), which needs no client library.
    implementation 'org.json:json:20240303'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
    // The property-based tests draw thousands of cases from a seeded PRNG. Override to reproduce a
    // reported failure exactly: ./gradlew test -Dbot.test.seed=123456
    systemProperty 'bot.test.seed', System.getProperty('bot.test.seed', '20260809')
}

application {
    mainClass = 'com.bot.app.TestnetBot'
}

shadowJar {
    archiveFileName = 'bot.jar'
    mergeServiceFiles()
}

jar {
    manifest {
        attributes(
                "Main-Class": "com.bot.app.TestnetBot"
        )
    }
}
